name: Deploy (sarma-crm)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-selectel
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Reject superseded deployment
        run: |
          set -euo pipefail
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          [ "$(git rev-parse HEAD)" = "$latest" ] || { echo 'This revision was superseded on main; deploy the latest successful CI run.'; exit 1; }
      - name: Set up verified SSH access
        env:
          SELECTEL_SSH_PRIVATE_KEY: ${{ secrets.SELECTEL_SSH_PRIVATE_KEY }}
        run: bash deploy/selectel/ssh-setup.sh
      - name: Export, restore-test and encrypt backup
        env:
          PULSE_BACKUP_PASSPHRASE: ${{ secrets.PULSE_BACKUP_PASSPHRASE }}
        run: bash deploy/selectel/export-backup.sh
      - name: Save encrypted off-server backup
        uses: actions/upload-artifact@v4
        with:
          name: pulse-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pulse-backup.tar.gz.gpg
          if-no-files-found: error
          retention-days: 30
      - name: Package and deliver exact source revision
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          git archive --format=tar.gz -o "$RUNNER_TEMP/pulse-source.tar.gz" HEAD
          ssh -F "$RUNNER_TEMP/pulse-ssh/config" pulse-selectel "mkdir -p /root/pulse-releases/$revision"
          scp -F "$RUNNER_TEMP/pulse-ssh/config" "$RUNNER_TEMP/pulse-source.tar.gz" "pulse-selectel:/root/pulse-releases/$revision/source.tar.gz"
          ssh -F "$RUNNER_TEMP/pulse-ssh/config" pulse-selectel "tar -xzf /root/pulse-releases/$revision/source.tar.gz -C /root/pulse-releases/$revision"
      - name: Build and deploy Pulse on Selectel
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          ssh -F "$RUNNER_TEMP/pulse-ssh/config" pulse-selectel "bash /root/pulse-releases/$revision/deploy/selectel/deploy.sh $revision"
      - name: Verify public HTTPS
        run: curl --fail --silent --show-error --retry 3 --max-time 20 https://sarma-crm.ru/ready
      - name: Remove runner SSH credentials and encrypted temporary file
        if: always()
        run: rm -rf "$RUNNER_TEMP/pulse-ssh" "$RUNNER_TEMP/pulse-backup.tar.gz.gpg"
