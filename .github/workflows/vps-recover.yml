name: VPS recover

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Диагностика, routing-recover (только общий nginx), обслуживание VPS"
        type: choice
        options:
          - diag
          - routing-diag
          - routing-recover
          - performance
          - disk
          - cache-prune
          - journal-limit
          - recover
          - gitssh
          - telegram-relay
          - telegram-diag
        default: diag
      worker_url:
        description: "telegram-relay: адрес воркера (https://<имя>.<аккаунт>.workers.dev), без завершающего /"
        type: string
        required: false
        default: ""

jobs:
  recover:
    concurrency:
      group: sarma-crm-vps
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            if [ "${{ github.event.inputs.mode }}" = "routing-recover" ]; then
              set -euo pipefail
              cd /home/ubuntu/sarma-crm
              git fetch origin main
              git reset --hard origin/main
              bash scripts/reload_proxy.sh
              exit 0
            fi
            if [ "${{ github.event.inputs.mode }}" = "routing-diag" ]; then
              set -eu
              cd /home/ubuntu/sarma-crm
              sudo docker compose ps
              sudo docker inspect --format '{{.Name}} mounts={{json .Mounts}} networks={{json .NetworkSettings.Networks}}' sarma-crm-nginx-1 guide_bot-webapi-1
              sudo docker exec sarma-crm-nginx-1 nginx -T 2>&1 | awk '/^# configuration file/ || /^[[:space:]]*(listen|server_name|proxy_pass|ssl_certificate|include)[[:space:]]/'
              sudo docker exec sarma-crm-nginx-1 sh -c 'find /etc/letsencrypt/live -maxdepth 2 -name fullchain.pem -print'
              sudo find /home/ubuntu/guide_bot -maxdepth 4 -type f \( -iname '*nginx*' -o -iname '*caddy*' -o -iname '*compose*yml' -o -iname '*compose*yaml' \) -print
              curl --max-time 10 -sS -o /dev/null -w 'guide backend HTTP: %{http_code}\n' http://127.0.0.1:8000/ || true
              curl --max-time 10 -sS -o /dev/null -w 'guide HTTPS: %{http_code}\n' --resolve guide-crm.ru:443:127.0.0.1 https://guide-crm.ru/ || true
              curl --max-time 10 -sS -o /dev/null -w 'pulse HTTPS: %{http_code}\n' --resolve sarma-crm.ru:443:127.0.0.1 https://sarma-crm.ru/ || true
              exit 0
            fi
            if [ "${{ github.event.inputs.mode }}" = "journal-limit" ]; then
              set -euo pipefail
              export LC_ALL=C
              cd /home/ubuntu/sarma-crm
              sudo docker compose exec -T web python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).status)"
              printf '\nBefore journal cleanup:\n'
              df -hT /
              sudo journalctl --disk-usage
              available_before=$(df -B1 --output=avail / | tail -n 1)
              journal_config=/etc/systemd/journald.conf.d/99-sarma-disk-limit.conf
              if sudo test -e "$journal_config"; then
                if ! printf '[Journal]\nSystemMaxUse=200M\nRuntimeMaxUse=200M\n' | sudo cmp -s "$journal_config" -; then
                  printf 'Existing journal limit file differs; leaving it unchanged.\n' >&2
                  exit 1
                fi
              else
                sudo install -d -m 755 /etc/systemd/journald.conf.d
                printf '[Journal]\nSystemMaxUse=200M\nRuntimeMaxUse=200M\n' | sudo tee "$journal_config" >/dev/null
                sudo chmod 644 "$journal_config"
              fi
              sudo systemd-analyze cat-config systemd/journald.conf | awk -F= '
                /^[[:space:]]*SystemMaxUse[[:space:]]*=/ {system_limit=$2; gsub(/[[:space:]]/, "", system_limit)}
                /^[[:space:]]*RuntimeMaxUse[[:space:]]*=/ {runtime_limit=$2; gsub(/[[:space:]]/, "", runtime_limit)}
                END {printf "SystemMaxUse=%s RuntimeMaxUse=%s\n", system_limit, runtime_limit; if (system_limit != "200M" || runtime_limit != "200M") exit 1}'
              sudo systemctl restart systemd-journald
              sudo systemctl is-active --quiet systemd-journald
              sudo journalctl --rotate --vacuum-size=200M
              printf '\nAfter journal cleanup:\n'
              sudo journalctl --disk-usage
              df -hT /
              available_after=$(df -B1 --output=avail / | tail -n 1)
              printf 'Root filesystem available-space change: %s bytes\n' "$((available_after - available_before))"
              sudo docker compose ps
              sudo docker compose exec -T web python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).status)"
              exit 0
            fi
            if [ "${{ github.event.inputs.mode }}" = "cache-prune" ]; then
              set -euo pipefail
              export LC_ALL=C
              cd /home/ubuntu/sarma-crm
              sudo docker compose exec -T web python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).status)"
              printf '\nBefore cache cleanup:\n'
              df -hT /
              sudo docker system df
              available_before=$(df -B1 --output=avail / | tail -n 1)
              sudo docker builder prune --all --force --filter 'until=168h'
              printf '\nAfter cache cleanup:\n'
              df -hT /
              sudo docker system df
              available_after=$(df -B1 --output=avail / | tail -n 1)
              printf 'Root filesystem available-space change: %s bytes\n' "$((available_after - available_before))"
              sudo docker compose ps
              sudo docker compose exec -T web python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).status)"
              exit 0
            fi
            if [ "${{ github.event.inputs.mode }}" = "disk" ]; then
              set -euo pipefail
              export LC_ALL=C
              df -hT /
              df -i /
              sudo docker system df -v
              sudo journalctl --disk-usage
              for directory in /var /var/lib /var/log /home /home/ubuntu; do
                if [ -d "$directory" ]; then
                  sudo timeout 90s nice -n 10 du -x -h --max-depth=1 "$directory"
                fi
              done
              docker_root=$(sudo docker info --format '{{.DockerRootDir}}')
              if [ -n "$docker_root" ] && [ -d "$docker_root" ]; then
                sudo timeout 90s nice -n 10 du -x -h --max-depth=1 "$docker_root"
              fi
              if [ -d /home/ubuntu/sarma_backups ]; then
                sudo du -sh /home/ubuntu/sarma_backups
                sudo find /home/ubuntu/sarma_backups -maxdepth 1 -type f -name 'backup_*.sql.gz' -printf '%s bytes %f\n' | sort -nr | sed -n '1,20p'
              fi
              for container in $(sudo docker ps -aq); do
                sudo docker inspect --format '{{.Name}} log_driver={{.HostConfig.LogConfig.Type}} log_options={{json .HostConfig.LogConfig.Config}}' "$container"
                log_path=$(sudo docker inspect --format '{{.LogPath}}' "$container")
                if [ -n "$log_path" ] && sudo test -f "$log_path"; then
                  sudo stat -c '%s bytes %n' "$log_path"
                fi
              done
              exit 0
            fi
            if [ "${{ github.event.inputs.mode }}" = "performance" ]; then
              set -euo pipefail
              cd /home/ubuntu/sarma-crm
              git rev-parse HEAD
              uptime
              free -m
              df -h /
              sudo docker compose ps
              sudo docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} MEM={{.MemUsage}}'
              sudo docker compose exec -T web python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).status)"
              sudo docker compose logs --no-color --no-log-prefix --since 24h --tail 20000 web | sudo docker compose exec -T web python -m app.performance_report
              exit 0
            fi
            set +e
            echo "=== uptime / load ==="
            uptime
            echo "=== disk ==="
            df -h /
            echo "=== mem ==="
            free -m
            echo "=== ufw ==="
            sudo ufw status verbose 2>&1
            echo "=== iptables INPUT ==="
            sudo iptables -S INPUT 2>&1 | head -30
            echo "=== who is on :80 / :443 ==="
            sudo ss -tlnp | grep -E ':80 |:443 |:22 ' || true
            echo "=== caddy ==="
            systemctl is-active caddy; systemctl is-enabled caddy
            sudo systemctl status caddy --no-pager 2>&1 | head -20
            echo "=== docker ==="
            sudo systemctl is-active docker
            sudo docker ps -a 2>&1 | head -30
            echo "=== compose ps ==="
            cd /home/ubuntu/sarma-crm && sudo docker compose ps 2>&1
            echo "=== nginx container logs ==="
            sudo docker logs sarma-crm-nginx-1 --tail 25 2>&1
            echo "=== web container logs ==="
            sudo docker logs sarma-crm-web-1 --tail 25 2>&1

            if [ "${{ github.event.inputs.mode }}" = "recover" ]; then
              echo "=== RECOVER ==="
              sudo systemctl stop caddy 2>&1
              sudo systemctl disable caddy 2>&1
              echo "--- open 80/443/22 in ufw ---"
              sudo ufw allow 22/tcp 2>&1
              sudo ufw allow 80/tcp 2>&1
              sudo ufw allow 443/tcp 2>&1
              sudo ufw reload 2>&1
              sudo ufw status 2>&1
              cd /home/ubuntu/sarma-crm
              git fetch --all && git reset --hard origin/main
              sudo docker compose down --remove-orphans 2>&1
              sudo docker compose up -d --build 2>&1
              echo "--- wait 25s ---"
              sleep 25
              sudo docker compose ps 2>&1
              curl -s -o /dev/null -w "nginx :80 /health -> %{http_code}\n" http://127.0.0.1/health
              curl -sk -o /dev/null -w "nginx :443 / -> %{http_code}\n" https://127.0.0.1/ --resolve sarma-crm.ru:443:127.0.0.1
            fi

            if [ "${{ github.event.inputs.mode }}" = "gitssh" ]; then
              echo "=== GITSSH ==="
              echo "--- outbound github reachability ---"
              (nc -zv -w 8 github.com 22 2>&1); echo "  ^ github.com:22 (нужен для SSH-remote)"
              (nc -zv -w 8 github.com 443 2>&1); echo "  ^ github.com:443 (текущий HTTPS-remote)"
              (nc -zv -w 8 api.telegram.org 443 2>&1); echo "  ^ api.telegram.org:443 (для справки)"

              mkdir -p ~/.ssh && chmod 700 ~/.ssh
              if [ ! -f ~/.ssh/gh_deploy ]; then
                ssh-keygen -t ed25519 -f ~/.ssh/gh_deploy -N "" -C "sarma-crm-vps-$(date +%F)"
              fi
              chmod 600 ~/.ssh/gh_deploy
              echo "=== PUBLIC KEY — добавить в Settings -> Deploy keys (read-only) ==="
              cat ~/.ssh/gh_deploy.pub
              echo "=== /PUBLIC KEY ==="

              ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts

              if ! grep -q "Host github.com" ~/.ssh/config 2>/dev/null; then
                printf 'Host github.com\n  User git\n  IdentityFile ~/.ssh/gh_deploy\n  IdentitiesOnly yes\n' >> ~/.ssh/config
              fi
              chmod 600 ~/.ssh/config

              cd /home/ubuntu/sarma-crm
              git remote set-url origin git@github.com:lakalyut/sarma-crm.git
              git remote -v
              echo "--- ssh -T с ЯВНЫМ ключом gh_deploy ---"
              ssh -i ~/.ssh/gh_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 -T git@github.com 2>&1 | head -3
              echo "--- git fetch (какой ключ реально принят) ---"
              GIT_SSH_COMMAND="ssh -v" git ls-remote origin -h refs/heads/main 2>&1 | grep -iE "Offering public key|Server accepts key|Authenticated to|Hi lakalyut|refs/heads/main" | head -8
              git fetch --all 2>&1 | head -8
              git log --oneline -1 origin/main 2>&1
            fi

            if [ "${{ github.event.inputs.mode }}" = "telegram-relay" ]; then
              echo "=== TELEGRAM RELAY ==="
              cd /home/ubuntu/sarma-crm
              # подтягиваем docker-compose.yml с уже проброшенными
              # TELEGRAM_API_BASE_URL/TELEGRAM_RELAY_SECRET в environment:
              # сервиса web (без этого переменные в .env ни на что не влияют)
              git fetch --all && git reset --hard origin/main

              WORKER_URL="${{ github.event.inputs.worker_url }}"
              RELAY_SECRET="${{ secrets.TELEGRAM_RELAY_SECRET }}"

              set_env_var() {
                key="$1"; value="$2"
                [ -z "$value" ] && return 0
                if grep -q "^${key}=" .env 2>/dev/null; then
                  sudo sed -i "s|^${key}=.*|${key}=${value}|" .env
                else
                  echo "${key}=${value}" | sudo tee -a .env >/dev/null
                fi
              }

              set_env_var TELEGRAM_API_BASE_URL "$WORKER_URL"
              set_env_var TELEGRAM_RELAY_SECRET "$RELAY_SECRET"

              echo "--- ключи в .env сейчас (значения не печатаем) ---"
              sudo grep -oE '^[A-Z_]+=' .env | sort

              sudo docker compose up -d --build --remove-orphans 2>&1
              echo "--- wait 20s ---"
              sleep 20
              sudo docker compose ps 2>&1
              curl -s -o /dev/null -w "web /health -> %{http_code}\n" http://127.0.0.1/health
            fi

            if [ "${{ github.event.inputs.mode }}" = "telegram-diag" ]; then
              echo "=== TELEGRAM DIAG (сквозь релей, с самого VPS) ==="
              cd /home/ubuntu/sarma-crm
              # Не читаем .env целиком (там и POSTGRES_PASSWORD/APP_SECRET_KEY) —
              # только три нужные строки, значения не печатаем нигде.
              TOKEN=$(grep '^TELEGRAM_TOKEN=' .env | head -1 | cut -d= -f2-)
              BASE_URL=$(grep '^TELEGRAM_API_BASE_URL=' .env | head -1 | cut -d= -f2-)
              SECRET=$(grep '^TELEGRAM_RELAY_SECRET=' .env | head -1 | cut -d= -f2-)

              if [ -z "$TOKEN" ]; then
                echo "TELEGRAM_TOKEN пуст в .env — дальше нечего проверять"
              elif [ -z "$BASE_URL" ]; then
                echo "TELEGRAM_API_BASE_URL пуст — релей ещё не прописан (см. mode=telegram-relay)"
              else
                echo "--- прямой api.telegram.org (ожидаемо не отвечает, для контраста) ---"
                curl -s -m 8 -o /dev/null -w "direct getMe -> %{http_code} (timeout/000 — это и есть блокировка)\n" \
                  "https://api.telegram.org/bot${TOKEN}/getMe"

                echo "--- через воркер-релей ---"
                curl -s -m 15 -H "X-Relay-Secret: ${SECRET}" "${BASE_URL}/bot${TOKEN}/getMe"
                echo
                echo "--- getWebhookInfo (бот на long polling, app/telegram_poller.py — url должен быть ПУСТ, это норма, не проблема) ---"
                curl -s -m 15 -H "X-Relay-Secret: ${SECRET}" "${BASE_URL}/bot${TOKEN}/getWebhookInfo"
                echo
                echo "(режим только на чтение — раньше здесь была автоматическая регистрация"
                echo " вебхука при пустом url; убрано 2026-09-12 при переходе на polling —"
                echo " пустой url теперь ОЖИДАЕМОЕ состояние, регистрировать его обратно нельзя,"
                echo " иначе конфликтует с getUpdates у поллера)."
              fi
            fi
            true
