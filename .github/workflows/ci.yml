name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sarma_test
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: sarma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sarma_test -d sarma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Mini-app interaction tests
        run: node --test tests/js/*.test.js

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .

      - name: Format check
        run: |
          black --check .

      - name: Tests
        env:
          DATABASE_URL: "sqlite:///./test.db"
          APP_SECRET_KEY: "ci-secret"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q

      - name: Mini-app and city access tests on PostgreSQL
        env:
          DATABASE_URL: "postgresql+psycopg://sarma_test:ci-test-password@localhost:5432/sarma_test"
          APP_SECRET_KEY: "ci-secret"
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_miniapp_clients_abc.py tests/test_city_rename.py tests/test_brand_ambassador.py tests/test_empty_city_delete.py tests/test_admin_imports_delete.py tests/test_import_xlsx.py tests/test_import_optimization.py tests/test_observability.py

      - name: Install Chromium for UI regression tests
        run: |
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium

      - name: Browser UI regression tests
        env:
          DATABASE_URL: "sqlite:///./ui-test.db"
          APP_SECRET_KEY: "ci-secret"
          TELEGRAM_POLLING_ENABLED: "0"
          RUN_BROWSER_TESTS: "1"
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_ui_browser.py

      - name: Build and check production image
        run: |
          docker build -t pulse-image-check .
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://sarma_test:ci-test-password@127.0.0.1:5432/postgres", autocommit=True) as connection:
              connection.execute("CREATE DATABASE sarma_image_test")
          PY
          docker run --rm -i --network host \
            -e IMAGE_SMOKE_TEST=1 \
            -e DATABASE_URL=postgresql+psycopg://sarma_test:ci-test-password@127.0.0.1:5432/sarma_image_test \
            pulse-image-check python - < scripts/check_image.py
