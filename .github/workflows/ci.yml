name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sarma_test
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: sarma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sarma_test -d sarma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Mini-app interaction tests
        run: node --test tests/js/*.test.js

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .

      - name: Format check
        run: |
          black --check .

      - name: Tests
        env:
          DATABASE_URL: "sqlite:///./test.db"
          APP_SECRET_KEY: "ci-secret"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q

      - name: ABC and city rename tests on PostgreSQL
        env:
          DATABASE_URL: "postgresql+psycopg://sarma_test:ci-test-password@localhost:5432/sarma_test"
          APP_SECRET_KEY: "ci-secret"
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_miniapp_clients_abc.py tests/test_city_rename.py
