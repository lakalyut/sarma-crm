name: Selectel storage diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-selectel
  cancel-in-progress: false

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up verified SSH access
        env:
          SELECTEL_SSH_PRIVATE_KEY: ${{ secrets.SELECTEL_SSH_PRIVATE_KEY }}
        run: bash deploy/selectel/ssh-setup.sh
      - name: Inspect shared server storage
        run: |
          ssh -F "$RUNNER_TEMP/pulse-ssh/config" pulse-selectel 'df -h /; docker system df; du -sh /root/pulse-backups /root/pulse-releases 2>/dev/null || true'
      - name: Remove runner SSH credentials and encrypted temporary file
        if: always()
        run: rm -rf "$RUNNER_TEMP/pulse-ssh" "$RUNNER_TEMP/pulse-backup.tar.gz.gpg"
