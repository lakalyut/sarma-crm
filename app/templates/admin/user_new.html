{% extends "base.html" %}
{% block content %}
<div class="card-narrow">
  <h1>Новый пользователь</h1>

 {% include "includes/messages.html" %}

  <form method="post" action="/admin/users/new">
    <div class="field">
      <label>Email</label>
      <input type="email" name="email" required placeholder="user@example.com">
    </div>

    <div class="field">
      <label>Роль</label>
      <select name="role" class="js-custom-select">
        <option value="user" selected>user (клиенты + графики)</option>
        <option value="admin">admin (полный доступ)</option>
        <option value="ambassador">ambassador (визиты через Telegram-бота)</option>
      </select>
    </div>

    <div class="field">
      <label>Telegram ID</label>
      <input type="text" name="telegram_id" placeholder="Только для роли ambassador">
      <div class="field-hint">
        Нужен только для ambassador — узнать заранее у самого амбассадора
        (например через @userinfobot). Для остальных ролей поле игнорируется.
      </div>
    </div>

    <div class="flex-row actions-split">
      <a class="btn btn-secondary" href="/admin/users">Назад</a>
      <button type="submit">Создать</button>
    </div>
  </form>
</div>
{% endblock %}
