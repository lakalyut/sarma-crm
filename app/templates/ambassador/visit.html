{% extends "base_ambassador.html" %}
{% block content %}
<h1>Записать визит</h1>

{% if error %}
  <div class="message error">{{ error }}</div>
{% endif %}
{% if message %}
  <div class="message ok">{{ message }}</div>
{% endif %}

<form method="post" action="/ambassador/visit" id="visit-form">
  <div id="visit-options" data-options="{{ options|tojson }}"></div>

  <div class="field is-hidden" id="city-field">
    <label>Город</label>
    <select name="city" id="city-select" class="js-custom-select"></select>
  </div>

  <div class="field filter-field filter-field-region-search">
    <label>Клиент</label>
    <input type="text" id="client-input" placeholder="Начните вводить название" autocomplete="off">
    <input type="hidden" name="client" id="client-hidden">
    <div class="search-dropdown" id="client-dropdown" style="display:none;"></div>
    <div class="field-hint" id="selected-client" style="display:none;"></div>
  </div>

  <div class="visit-history is-hidden" id="visit-history">
    <div class="visit-history-title">История по точке</div>
    <div id="visit-history-list"></div>
  </div>

  <div class="field">
    <label>Тип точки</label>
    <select name="sale_type" id="type-select" class="js-custom-select"></select>
  </div>

  <div class="field">
    <div class="visit-collapse" id="aromas-collapse">
      <button type="button" class="visit-collapse-head" id="aromas-toggle" aria-expanded="false">
        <span class="visit-collapse-label">Ароматы <span class="visit-collapse-count" id="aromas-count">не выбраны</span></span>
        <svg class="visit-collapse-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="visit-collapse-body is-hidden" id="aromas-body">
        <input type="text" id="product-search" placeholder="Поиск по названию или SKU" autocomplete="off" style="margin-bottom: 8px;">
        <div id="products-list"></div>
      </div>
    </div>
  </div>

  <div class="field">
    <label>Кол-во SKU на полке (по линейкам)</label>
    <div class="visit-sku-grid">
      <label class="visit-sku-item">
        <span>Классическая</span>
        <input type="number" name="sku_classic" min="0" step="1" inputmode="numeric">
      </label>
      <label class="visit-sku-item">
        <span>Крепкая</span>
        <input type="number" name="sku_strong" min="0" step="1" inputmode="numeric">
      </label>
      <label class="visit-sku-item">
        <span>Лёгкая</span>
        <input type="number" name="sku_light" min="0" step="1" inputmode="numeric">
      </label>
    </div>
  </div>

  <div class="field">
    <label>Кол-во человек на мероприятии</label>
    <input type="number" name="people_count" min="0" step="1" inputmode="numeric">
  </div>

  <div class="field">
    <label>Цель визита</label>
    <div id="goal-chips" class="visit-goal-chips"></div>
    <input type="text" name="goal" id="goal-input" placeholder="Или впишите свою цель" autocomplete="off">
  </div>

  <div class="field">
    <label>Комментарий</label>
    <textarea name="comment" id="comment-input" rows="3" placeholder="Заметки по точке — увидят на следующем визите"></textarea>
  </div>

  <div class="message error" id="visit-invalid-note" hidden>Заполните выделенные поля — все поля визита обязательны.</div>
  <button type="submit" id="submit-btn">Записать визит</button>
</form>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const options = JSON.parse(document.getElementById("visit-options").dataset.options);

    const citySelect = document.getElementById("city-select");
    const clientInput = document.getElementById("client-input");
    const clientHidden = document.getElementById("client-hidden");
    const clientDropdown = document.getElementById("client-dropdown");
    const selectedClientEl = document.getElementById("selected-client");
    const typeSelect = document.getElementById("type-select");
    const productsList = document.getElementById("products-list");
    const productSearch = document.getElementById("product-search");
    const submitBtn = document.getElementById("submit-btn");
    const goalInput = document.getElementById("goal-input");
    const goalChips = document.getElementById("goal-chips");
    const historyBox = document.getElementById("visit-history");
    const historyList = document.getElementById("visit-history-list");

    (options.visit_goals || []).forEach(g => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "visit-goal-chip";
        chip.textContent = g;
        chip.addEventListener("click", () => {
            goalInput.value = g;
            refreshValidity();
        });
        goalChips.appendChild(chip);
    });

    const aromasToggle = document.getElementById("aromas-toggle");
    const aromasBody = document.getElementById("aromas-body");
    const aromasCount = document.getElementById("aromas-count");

    aromasToggle.addEventListener("click", function () {
        const open = aromasBody.classList.toggle("is-hidden") === false;
        aromasToggle.setAttribute("aria-expanded", open ? "true" : "false");
    });

    function updateAromasCount() {
        const n = document.querySelectorAll('#products-list input[type="checkbox"]:checked').length;
        aromasCount.textContent = n ? n + " выбрано" : "не выбраны";
        aromasCount.classList.toggle("visit-collapse-count-empty", n === 0);
    }

    function escHtml(s) {
        return String(s ?? "").replace(/[&<>"']/g, c => (
            { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
        ));
    }

    function renderHistory(items) {
        if (!items || !items.length) {
            historyBox.classList.add("is-hidden");
            historyList.innerHTML = "";
            return;
        }
        historyList.innerHTML = items.map(h => (
            '<div class="visit-history-item">' +
                '<div class="visit-history-meta">' + escHtml(h.date) +
                    " · " + escHtml(h.ambassador) +
                    (h.sale_type ? " · " + escHtml(h.sale_type) : "") + "</div>" +
                (h.goal ? '<div class="visit-history-goal">Цель: ' + escHtml(h.goal) + "</div>" : "") +
                (h.comment ? '<div class="visit-history-comment">' + escHtml(h.comment) + "</div>" : "") +
            "</div>"
        )).join("");
        historyBox.classList.remove("is-hidden");
    }

    function loadHistory(client) {
        if (!client) { renderHistory([]); return; }
        fetch("/ambassador/visit-history?client=" + encodeURIComponent(client))
            .then(r => r.ok ? r.json() : { history: [] })
            .then(d => renderHistory(d.history))
            .catch(() => renderHistory([]));
    }

    citySelect.innerHTML = options.cities.map(c => '<option value="' + c + '">' + c + '</option>').join("");
    if (options.cities.length > 1) {
        document.getElementById("city-field").classList.remove("is-hidden");
    }

    function currentCity() {
        return citySelect.value || options.cities[0] || "";
    }

    function renderClientList(filterText) {
        const clients = options.clients_by_city[currentCity()] || [];
        const matches = filterClientList(clients, filterText);

        if (!matches.length) {
            clientDropdown.style.display = "none";
            clientDropdown.innerHTML = "";
            return;
        }
        clientDropdown.innerHTML = matches.map(c =>
            '<div class="search-dropdown-item" data-client="' + c.replace(/"/g, "&quot;") + '">' + c + "</div>"
        ).join("");
        clientDropdown.style.display = "block";
    }

    const surveyInputs = Array.from(document.querySelectorAll(
        'input[name="sku_classic"], input[name="sku_strong"], input[name="sku_light"], input[name="people_count"], #goal-input, #comment-input'
    ));

    // Кнопка «Записать визит» всегда активна. Раньше она блокировалась до
    // заполнения всех полей — но без объяснения, что именно не заполнено.
    // Теперь по клику подсвечиваем красным незаполненные обязательные поля.
    const form = document.getElementById("visit-form");
    const invalidNote = document.getElementById("visit-invalid-note");
    let validationShown = false;

    function requiredChecks() {
        return [
            { ok: !!clientHidden.value, el: clientInput.closest(".field") },
            { ok: !!typeSelect.value, el: typeSelect.closest(".field") },
            {
                ok: document.querySelectorAll('#products-list input[type="checkbox"]:checked').length > 0,
                el: document.getElementById("aromas-collapse"),
                aromas: true,
            },
            { ok: form.sku_classic.value.trim() !== "", el: form.sku_classic },
            { ok: form.sku_strong.value.trim() !== "", el: form.sku_strong },
            { ok: form.sku_light.value.trim() !== "", el: form.sku_light },
            { ok: form.people_count.value.trim() !== "", el: form.people_count.closest(".field") },
            { ok: goalInput.value.trim() !== "", el: goalInput.closest(".field") },
            { ok: document.getElementById("comment-input").value.trim() !== "", el: document.getElementById("comment-input").closest(".field") },
        ];
    }

    function paintValidity() {
        let firstBad = null;
        let aromasBad = false;
        requiredChecks().forEach(c => {
            if (c.el) c.el.classList.toggle("is-invalid", !c.ok);
            if (!c.ok && !firstBad) firstBad = c.el;
            if (!c.ok && c.aromas) aromasBad = true;
        });
        if (invalidNote) invalidNote.hidden = !firstBad;
        return { valid: !firstBad, firstBad, aromasBad };
    }

    function refreshValidity() {
        if (validationShown) paintValidity();
    }

    surveyInputs.forEach(el => el.addEventListener("input", refreshValidity));

    form.addEventListener("submit", function (e) {
        validationShown = true;
        const { valid, firstBad, aromasBad } = paintValidity();
        if (!valid) {
            e.preventDefault();
            if (aromasBad) {
                aromasBody.classList.remove("is-hidden");
                aromasToggle.setAttribute("aria-expanded", "true");
            }
            (firstBad || invalidNote).scrollIntoView({ behavior: "smooth", block: "center" });
        }
    });

    function renderProducts() {
        const type = typeSelect.value;
        const segmentId = options.guessed_segment_by_type[type];
        const groups = groupProductsByCategory(options.products, segmentId, options.abc_by_segment);

        let html = "";
        for (const group of groups) {
            html += '<div class="field-hint category-heading" style="margin-top:8px;">' + group.category + "</div>";
            for (const item of group.items) {
                const p = item.product;
                const badge = item.abc ? '<span class="abc-badge abc-badge-' + item.abc.toLowerCase() + '">' + item.abc + "</span>" : "";
                const newBadge = p.is_new ? '<span class="abc-badge abc-badge-new">Новинка</span>' : "";
                html += '<label class="product-row" data-search="' + item.searchKey.replace(/"/g, "&quot;") + '" style="display:flex; align-items:center; gap:8px; padding:6px 0;">' +
                    '<input type="checkbox" name="product_ids" value="' + p.id + '">' +
                    "<span>" + p.brand + " — " + p.flavor + "</span>" + badge + newBadge + "</label>";
            }
        }
        productsList.innerHTML = html;
        productsList.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            cb.addEventListener("change", function () {
                updateAromasCount();
                refreshValidity();
            });
        });
        productSearch.value = "";
        updateAromasCount();
        refreshValidity();
    }

    function filterProducts() {
        const q = productSearch.value.trim().toLowerCase();
        let currentCategoryHeading = null;
        let currentCategoryHasMatch = false;

        productsList.querySelectorAll(".category-heading, .product-row").forEach(el => {
            if (el.classList.contains("category-heading")) {
                if (currentCategoryHeading) {
                    currentCategoryHeading.style.display = currentCategoryHasMatch ? "" : "none";
                }
                currentCategoryHeading = el;
                currentCategoryHasMatch = false;
                return;
            }
            const visible = !q || el.dataset.search.includes(q);
            el.style.display = visible ? "" : "none";
            if (visible) currentCategoryHasMatch = true;
        });
        if (currentCategoryHeading) {
            currentCategoryHeading.style.display = currentCategoryHasMatch ? "" : "none";
        }
    }

    function onCityChange() {
        clientHidden.value = "";
        clientInput.value = "";
        selectedClientEl.style.display = "none";
        clientDropdown.style.display = "none";

        typeSelect.innerHTML = (options.types_by_city[currentCity()] || [])
            .map(t => '<option value="' + t + '">' + t + "</option>").join("");
        renderProducts();
        refreshValidity();
    }

    clientInput.addEventListener("input", function (e) {
        clientHidden.value = "";
        selectedClientEl.style.display = "none";
        renderHistory([]);
        renderClientList(e.target.value);
        refreshValidity();
    });

    clientDropdown.addEventListener("click", function (e) {
        const item = e.target.closest(".search-dropdown-item");
        if (!item) return;
        const value = item.dataset.client;
        clientHidden.value = value;
        clientInput.value = value;
        clientDropdown.style.display = "none";
        selectedClientEl.textContent = "Выбрано: " + value;
        selectedClientEl.style.display = "block";
        loadHistory(value);
        refreshValidity();
    });

    document.addEventListener("click", function (e) {
        if (!clientDropdown.contains(e.target) && e.target !== clientInput) {
            clientDropdown.style.display = "none";
        }
    });

    citySelect.addEventListener("change", onCityChange);
    typeSelect.addEventListener("change", renderProducts);
    productSearch.addEventListener("input", filterProducts);

    onCityChange();
});
</script>
{% endblock %}
