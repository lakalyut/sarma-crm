{% extends "base_ambassador.html" %}
{% block content %}
<div class="card-narrow">
  <h1>Заполните анкету</h1>
  <div class="page-subtitle" style="margin-bottom: 16px;">
    Имя и город — увидите только своих клиентов и записи визитов по этому городу.
  </div>

  {% include "includes/messages.html" %}

  <form method="post" action="/ambassador/profile">
    <div class="field">
      <label>Имя</label>
      <input type="text" name="first_name" required value="{{ user.first_name or '' }}">
    </div>

    <div class="field">
      <label>Фамилия</label>
      <input type="text" name="last_name" value="{{ user.last_name or '' }}">
    </div>

    <div class="field">
      <label>Город</label>
      <select name="city" class="js-custom-select" required>
        <option value="" disabled selected>Выберите город</option>
        {% for c in cities %}
          <option value="{{ c }}" {% if user.city == c %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
    </div>

    <button type="submit">Продолжить</button>
  </form>
</div>
{% endblock %}
