
{% extends 'base.html' %}
{% block content %}
<h1>Новый продукт</h1>
<form method="post">
    <div class="field">
        <label for="field-category">Категория</label>
        <input id="field-category" type="text" name="category" value="Табак для кальяна">
    </div>
    <div class="field">
        <label for="field-brand">Бренд</label>
        <input id="field-brand" type="text" name="brand" required placeholder='Сарма'>
    </div>
    <div class="field">
        <label for="field-line">Линейка (опционально)</label>
        <input id="field-line" type="text" name="line" placeholder='Легкая / Крепкая'>
    </div>
    <div class="field">
        <label for="field-flavor">Аромат</label>
        <input id="field-flavor" type="text" name="flavor" required placeholder='Банановое суфле'>
    </div>
    <div class="field">
        <label for="field-default_weight_g">Вес по умолчанию, г</label>
        <input id="field-default_weight_g" type="number" name="default_weight_g" value="120">
    </div>
    <button type="submit">Сохранить</button>
</form>
{% endblock %}
