
{% extends 'base.html' %}
{% block content %}
<h1>Импорт списка продуктов</h1>
<form method="post">
    <div class="field">
        <label for="field-category">Категория</label>
        <input id="field-category" type="text" name="category" value="Табак для кальяна">
    </div>
    <div class="field">
        <label for="field-default_weight_g">Вес по умолчанию, г</label>
        <input id="field-default_weight_g" type="number" name="default_weight_g" value="120">
    </div>
    <div class="field">
        <label for="field-lines">Список (по одному продукту на строку)</label>
        <textarea id="field-lines" name="lines" rows="10" placeholder='"Сарма" Банановое суфле
"САРМА 360" Легкая Азиатская Дыня'></textarea>
    </div>
    <button type="submit">Импортировать</button>
</form>
{% include "includes/messages.html" %}
{% endblock %}
